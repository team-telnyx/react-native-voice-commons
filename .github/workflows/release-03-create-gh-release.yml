# Creates the GitHub Release for each package in a merged release PR and publishes it to npm.
#
# Run it with the same versions given to release-01. For each package it:
#   - checks out the release PR's merge commit (not the current head of main),
#   - checks that package.json and CHANGELOG.md match the version,
#   - creates the voice-sdk-vX.Y.Z / commons-sdk-vX.Y.Z tag and GitHub Release,
#     using the package's CHANGELOG.md section as the release notes,
#   - publishes the package through publish.yml. voice-sdk is published first
#     because commons-sdk depends on it.
#
# Safe to re-run with the same versions: tags already on the release commit, existing
# GitHub Releases and versions already on npm are skipped, so a run that failed partway
# can be completed by dispatching it again.
#
# Uses GITHUB_TOKEN. Releases created with it don't trigger publish.yml's release
# event, so publish.yml is called directly and still uses npm trusted publishing.
name: release-03-create-gh-release

on:
  workflow_dispatch:
    inputs:
      voice_sdk_version:
        description: '@telnyx/react-native-voice-sdk version, for example 1.2.0 (blank to skip)'
        required: false
        default: ''
      commons_sdk_version:
        description: '@telnyx/react-voice-commons-sdk version, for example 1.1.2 (blank to skip)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  pull-requests: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub releases
    runs-on: ubuntu-latest
    outputs:
      voice_tag: ${{ steps.plan.outputs.voice_tag }}
      commons_tag: ${{ steps.plan.outputs.commons_tag }}

    steps:
      - name: Checkout main with full history and tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Plan release
        id: plan
        env:
          VOICE_SDK_VERSION: ${{ github.event.inputs.voice_sdk_version }}
          COMMONS_SDK_VERSION: ${{ github.event.inputs.commons_sdk_version }}
        run: scripts/release/release_package.sh plan "$VOICE_SDK_VERSION" "$COMMONS_SDK_VERSION"

      - name: Check out the release PR merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail
          sha=$(gh pr list --base main --head "$BRANCH" --state merged \
            --json mergeCommit --jq '.[0].mergeCommit.oid // empty')
          if [[ -z "$sha" ]]; then
            echo "::error::No merged release PR from $BRANCH. Use the same versions given to release-01."
            exit 1
          fi
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::Release PR merge commit $sha is not on main"; exit 1; }
          git checkout --detach "$sha"

      - name: Validate release files and build release notes
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          for tag in $TAGS; do
            if tag_sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              # A tag on this release commit means an earlier run stopped partway; carry on.
              if [[ "$tag_sha" != "$release_sha" ]]; then
                echo "::error::Tag $tag already exists on a different commit ($tag_sha)"
                exit 1
              fi
              echo "::warning::Tag $tag already exists on this release commit; resuming an earlier run"
            fi
          done
          if [[ -n "$VOICE_SDK_VERSION" ]]; then
            scripts/release/release_package.sh check voice-sdk "$VOICE_SDK_VERSION"
            scripts/release/release_package.sh notes voice-sdk "$VOICE_SDK_VERSION" > "$RUNNER_TEMP/notes-voice-sdk.md"
          fi
          if [[ -n "$COMMONS_SDK_VERSION" ]]; then
            scripts/release/release_package.sh check commons-sdk "$COMMONS_SDK_VERSION"
            scripts/release/release_package.sh notes commons-sdk "$COMMONS_SDK_VERSION" > "$RUNNER_TEMP/notes-commons-sdk.md"
          fi

      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          target_sha=$(git rev-parse HEAD)
          create_release() {
            local pkg=$1 version=$2 tag
            [[ -n "$version" ]] || return 0
            tag="$pkg-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::warning::GitHub Release $tag already exists; skipping"
              return 0
            fi
            args=("$tag" --target "$target_sha" --title "Release $tag" --notes-file "$RUNNER_TEMP/notes-$pkg.md")
            if [[ "$version" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          }
          create_release voice-sdk "$VOICE_SDK_VERSION"
          create_release commons-sdk "$COMMONS_SDK_VERSION"

  publish-voice-sdk:
    name: Publish voice-sdk to npm
    needs: create-release
    if: needs.create-release.outputs.voice_tag != ''
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag_name: ${{ needs.create-release.outputs.voice_tag }}

  publish-commons-sdk:
    name: Publish commons-sdk to npm
    needs: [create-release, publish-voice-sdk]
    # commons-sdk depends on voice-sdk, so wait for it to publish (or be skipped).
    if: |
      always() &&
      needs.create-release.result == 'success' &&
      needs.create-release.outputs.commons_tag != '' &&
      (needs.publish-voice-sdk.result == 'success' || needs.publish-voice-sdk.result == 'skipped')
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag_name: ${{ needs.create-release.outputs.commons_tag }}
