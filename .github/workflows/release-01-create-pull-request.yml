# Creates a release pull request for one or both npm packages.
#
# Each package is released under its own tag, which publish.yml uses to pick the package:
#   voice-sdk   -> voice-sdk-vX.Y.Z   -> @telnyx/react-native-voice-sdk
#   commons-sdk -> commons-sdk-vX.Y.Z -> @telnyx/react-voice-commons-sdk
#
# The PR bumps package.json versions, rebuilds react-voice-commons-sdk/lib/ from src/,
# and lists the merged PRs that touched each package. release-pr-check blocks merging
# until package.json and each package's CHANGELOG.md section agree.
#
# OpenAI Codex drafts each released package's CHANGELOG section from its
# "## Unreleased" notes and merged PRs, replacing the Unreleased section. It uses the
# same OPENAI_API_KEY secret as other Telnyx AI workflows. Each draft starts with an
# <!-- AI-DRAFT --> marker line, and release-pr-check fails until a maintainer reviews
# the section and deletes that line. Without the shared secret, or if Codex fails, the
# PR is still created and the maintainer writes the sections by hand.
#
# Uses GITHUB_TOKEN. PRs opened with it don't trigger workflows, so CI starts when the
# maintainer pushes the CHANGELOG commit. Requires the repository setting
# "Allow GitHub Actions to create and approve pull requests".
name: release-01-create-pull-request

on:
  workflow_dispatch:
    inputs:
      voice_sdk_version:
        description: '@telnyx/react-native-voice-sdk version, for example 1.2.0 (blank to skip)'
        required: false
        default: ''
      commons_sdk_version:
        description: '@telnyx/react-voice-commons-sdk version, for example 1.1.2 (blank to skip)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create release pull request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with full history and tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Plan release
        id: plan
        env:
          VOICE_SDK_VERSION: ${{ github.event.inputs.voice_sdk_version }}
          COMMONS_SDK_VERSION: ${{ github.event.inputs.commons_sdk_version }}
        run: scripts/release/release_package.sh plan "$VOICE_SDK_VERSION" "$COMMONS_SDK_VERSION"

      - name: Ensure release branch, tags and versions are new
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists; update that PR instead of re-running release-01"
            exit 1
          fi
          if [[ -n "$VOICE_SDK_VERSION" ]]; then
            scripts/release/release_package.sh ensure-new voice-sdk "$VOICE_SDK_VERSION"
          fi
          if [[ -n "$COMMONS_SDK_VERSION" ]]; then
            scripts/release/release_package.sh ensure-new commons-sdk "$COMMONS_SDK_VERSION"
          fi

      - name: Collect merged PRs for each package
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          collect() {
            local pkg=$1 version=$2 previous unreleased
            [[ -n "$version" ]] || return 0
            previous=$(scripts/release/release_package.sh previous-tag "$pkg")
            scripts/release/release_package.sh pr-notes "$pkg" "$previous" > pr_notes.md
            unreleased=$(scripts/release/release_package.sh unreleased-notes "$pkg")
            {
              echo "### $pkg $version (changes since ${previous:-the first commit})"
              if [[ -s pr_notes.md ]]; then cat pr_notes.md; else echo "- No merged PRs touched this package."; fi
              echo
            } >> release_notes.md
            {
              echo "### $pkg $version"
              if grep -q '[^[:space:]]' <<<"$unreleased"; then printf '%s\n' "$unreleased"; else echo "(none)"; fi
              echo
            } >> unreleased_notes.md
          }

          : > release_notes.md
          : > unreleased_notes.md
          collect voice-sdk "$VOICE_SDK_VERSION"
          collect commons-sdk "$COMMONS_SDK_VERSION"
          cat release_notes.md

          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            cat release_notes.md
            echo "$delimiter"
            echo "unreleased<<$delimiter"
            cat unreleased_notes.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          rm -f pr_notes.md release_notes.md unreleased_notes.md

      - name: Update package versions
        env:
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          if [[ -n "$VOICE_SDK_VERSION" ]]; then
            scripts/release/release_package.sh bump voice-sdk "$VOICE_SDK_VERSION"
          fi
          if [[ -n "$COMMONS_SDK_VERSION" ]]; then
            scripts/release/release_package.sh bump commons-sdk "$COMMONS_SDK_VERSION"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # react-voice-commons-sdk/lib/ is committed build output. Rebuild it here so the
      # release PR always carries lib/ compiled from src/, even if a contributor forgot
      # to run `npm run build`. npm publishing builds lib/ again from the release tag.
      - name: Rebuild commons-sdk lib/
        working-directory: react-voice-commons-sdk
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Check for shared OpenAI API key
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OPENAI_API_KEY is not available to this repository; skipping Codex CHANGELOG drafts"
          fi

      - name: Build CHANGELOG draft prompts
        if: steps.ai.outputs.enabled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          S=scripts/release/release_package.sh
          if [[ -n "$VOICE_SDK_VERSION" ]]; then
            $S draft-prompt voice-sdk "$VOICE_SDK_VERSION" "$($S previous-tag voice-sdk)" "$RUNNER_TEMP/changelog_prompt_voice-sdk.txt"
          fi
          if [[ -n "$COMMONS_SDK_VERSION" ]]; then
            $S draft-prompt commons-sdk "$COMMONS_SDK_VERSION" "$($S previous-tag commons-sdk)" "$RUNNER_TEMP/changelog_prompt_commons-sdk.txt"
          fi

      # Codex is sandboxed read-only and receives a self-contained prompt. A failure
      # here never blocks the release PR; the maintainer writes the section instead.
      - name: Draft voice-sdk CHANGELOG with Codex
        id: draft_voice
        if: steps.ai.outputs.enabled == 'true' && steps.plan.outputs.voice_version != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: openai/codex-action@v1.4
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/changelog_prompt_voice-sdk.txt
          output-file: ${{ runner.temp }}/changelog_response_voice-sdk.md
          working-directory: ${{ runner.temp }}
          sandbox: read-only
          model: gpt-5.4

      - name: Draft commons-sdk CHANGELOG with Codex
        id: draft_commons
        if: steps.ai.outputs.enabled == 'true' && steps.plan.outputs.commons_version != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: openai/codex-action@v1.4
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/changelog_prompt_commons-sdk.txt
          output-file: ${{ runner.temp }}/changelog_response_commons-sdk.md
          working-directory: ${{ runner.temp }}
          sandbox: read-only
          model: gpt-5.4

      - name: Add CHANGELOG drafts
        id: changelog
        if: always()
        env:
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
          VOICE_OUTCOME: ${{ steps.draft_voice.outcome }}
          COMMONS_OUTCOME: ${{ steps.draft_commons.outcome }}
          VOICE_DRAFT: ${{ runner.temp }}/changelog_response_voice-sdk.md
          COMMONS_DRAFT: ${{ runner.temp }}/changelog_response_commons-sdk.md
        run: |
          S=scripts/release/release_package.sh
          drafted=()
          if [[ "$VOICE_OUTCOME" == success ]] && $S insert-draft voice-sdk "$VOICE_SDK_VERSION" "$VOICE_DRAFT"; then
            drafted+=(voice-sdk)
          fi
          if [[ "$COMMONS_OUTCOME" == success ]] && $S insert-draft commons-sdk "$COMMONS_SDK_VERSION" "$COMMONS_DRAFT"; then
            drafted+=(commons-sdk)
          fi
          echo "drafted=${drafted[*]}" >> "$GITHUB_OUTPUT"

      - name: Create release pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ${{ steps.plan.outputs.branch }}
          base: main
          delete-branch: true
          commit-message: 'chore: release ${{ steps.plan.outputs.tags }}'
          title: 'Release ${{ steps.plan.outputs.tags }}'
          body: |
            Auto-created release pull request for `${{ steps.plan.outputs.tags }}`.

            ## Merged PRs since the previous release

            ${{ steps.notes.outputs.body }}

            ## Original Unreleased notes

            These are the maintainer-written source notes that Codex was asked to preserve. Compare them with each generated draft before deleting its `<!-- AI-DRAFT ... -->` marker.

            ${{ steps.notes.outputs.unreleased }}

            ## Release checklist

            - [ ] Make sure each released package's `CHANGELOG.md` (`package/` for voice-sdk, `react-voice-commons-sdk/` for commons-sdk) has a reviewed `## [X.Y.Z]` section. Codex drafted: **${{ steps.changelog.outputs.drafted || 'none' }}**. Edit each draft, then delete its `<!-- AI-DRAFT ... -->` line (release-pr-check fails until you do). Write any missing section by hand, for example by renaming `## Unreleased`.
            - [ ] Wait for `release-pr-check` and the other checks. They start when you push the CHANGELOG commit, because PRs opened with `GITHUB_TOKEN` don't trigger workflows.
            - [ ] After merging, run `release-03-create-gh-release` with the same versions (voice-sdk: `${{ steps.plan.outputs.voice_version || 'blank' }}`, commons-sdk: `${{ steps.plan.outputs.commons_version || 'blank' }}`).
          add-paths: |
            package/package.json
            react-voice-commons-sdk/package.json
            react-voice-commons-sdk/lib
            package/CHANGELOG.md
            react-voice-commons-sdk/CHANGELOG.md
          labels: auto-generated
