# Creates a release pull request for one or both npm packages.
#
# Each package is released under its own tag, which publish.yml uses to pick the package:
#   voice-sdk   -> voice-sdk-vX.Y.Z   -> @telnyx/react-native-voice-sdk
#   commons-sdk -> commons-sdk-vX.Y.Z -> @telnyx/react-voice-commons-sdk
#
# The PR bumps package.json versions, rebuilds react-voice-commons-sdk/lib/ from src/,
# and lists the merged PRs that touched each package. A maintainer writes each package's CHANGELOG.md section in the release PR;
# release-pr-check blocks merging until package.json and CHANGELOG.md agree.
#
# Uses GITHUB_TOKEN. PRs opened with it don't trigger workflows, so CI starts when the
# maintainer pushes the CHANGELOG commit. Requires the repository setting
# "Allow GitHub Actions to create and approve pull requests".
name: release-01-create-pull-request

on:
  workflow_dispatch:
    inputs:
      voice_sdk_version:
        description: '@telnyx/react-native-voice-sdk version, for example 1.2.0 (blank to skip)'
        required: false
        default: ''
      commons_sdk_version:
        description: '@telnyx/react-voice-commons-sdk version, for example 1.1.2 (blank to skip)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Create release pull request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main with full history and tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Plan release
        id: plan
        env:
          VOICE_SDK_VERSION: ${{ github.event.inputs.voice_sdk_version }}
          COMMONS_SDK_VERSION: ${{ github.event.inputs.commons_sdk_version }}
        run: scripts/release/release_package.sh plan "$VOICE_SDK_VERSION" "$COMMONS_SDK_VERSION"

      - name: Ensure release branch, tags and versions are new
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::$BRANCH already exists; update that PR instead of re-running release-01"
            exit 1
          fi
          if [[ -n "$VOICE_SDK_VERSION" ]]; then
            scripts/release/release_package.sh ensure-new voice-sdk "$VOICE_SDK_VERSION"
          fi
          if [[ -n "$COMMONS_SDK_VERSION" ]]; then
            scripts/release/release_package.sh ensure-new commons-sdk "$COMMONS_SDK_VERSION"
          fi

      - name: Collect merged PRs for each package
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          collect() {
            local pkg=$1 version=$2 previous
            [[ -n "$version" ]] || return 0
            previous=$(scripts/release/release_package.sh previous-tag "$pkg")
            scripts/release/release_package.sh pr-notes "$pkg" "$previous" > pr_notes.md
            {
              echo "### $pkg $version (changes since ${previous:-the first commit})"
              if [[ -s pr_notes.md ]]; then cat pr_notes.md; else echo "- No merged PRs touched this package."; fi
              echo
            } >> release_notes.md
          }

          : > release_notes.md
          collect voice-sdk "$VOICE_SDK_VERSION"
          collect commons-sdk "$COMMONS_SDK_VERSION"
          cat release_notes.md

          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<$delimiter"
            cat release_notes.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          rm -f pr_notes.md release_notes.md

      - name: Update package versions
        env:
          VOICE_SDK_VERSION: ${{ steps.plan.outputs.voice_version }}
          COMMONS_SDK_VERSION: ${{ steps.plan.outputs.commons_version }}
        run: |
          set -euo pipefail
          if [[ -n "$VOICE_SDK_VERSION" ]]; then
            scripts/release/release_package.sh bump voice-sdk "$VOICE_SDK_VERSION"
          fi
          if [[ -n "$COMMONS_SDK_VERSION" ]]; then
            scripts/release/release_package.sh bump commons-sdk "$COMMONS_SDK_VERSION"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # react-voice-commons-sdk/lib/ is committed build output. Rebuild it here so the
      # release PR always carries lib/ compiled from src/, even if a contributor forgot
      # to run `npm run build`. npm publishing builds lib/ again from the release tag.
      - name: Rebuild commons-sdk lib/
        working-directory: react-voice-commons-sdk
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run build

      # Keep every generated release file aligned with the same Prettier rules enforced by
      # code-quality.yml. The commons-sdk install above already provides the formatter.
      - name: Format generated release files
        run: |
          react-voice-commons-sdk/node_modules/.bin/prettier --write \
            package/package.json \
            react-voice-commons-sdk/package.json \
            "react-voice-commons-sdk/lib/**/*.{js,ts}"

      # Keep one canonical checklist for feature PRs and generated release PRs.
      - name: Load manual QA checklist from PR template
        id: qa
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { randomUUID } = require('node:crypto');
          const template = fs.readFileSync('.github/PULL_REQUEST_TEMPLATE.md', 'utf8');
          const heading = '## Application Flow Checklist';
          const start = template.indexOf(heading);
          if (start === -1) throw new Error('PR template is missing the Application Flow Checklist');
          const nextSection = template.indexOf('\n## ', start + heading.length);
          const checklist = template.slice(start, nextSection === -1 ? undefined : nextSection).trim();
          const delimiter = `QA_${randomUUID()}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${checklist}\n${delimiter}\n`);
          NODE

      - name: Create release pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ${{ steps.plan.outputs.branch }}
          base: main
          delete-branch: true
          commit-message: 'chore: release ${{ steps.plan.outputs.tags }}'
          title: 'Release ${{ steps.plan.outputs.tags }}'
          body: |
            Auto-created release pull request for `${{ steps.plan.outputs.tags }}`.

            ## Merged PRs since the previous release

            ${{ steps.notes.outputs.body }}

            ## Release checklist

            - [ ] Add a `## [X.Y.Z] (YYYY-MM-DD)` section to the `CHANGELOG.md` of each package being released (`package/CHANGELOG.md` for voice-sdk, `react-voice-commons-sdk/CHANGELOG.md` for commons-sdk), for example by renaming `## Unreleased`.
            - [ ] Wait for `release-pr-check` and the other checks. They start when you push the CHANGELOG commit, because PRs opened with `GITHUB_TOKEN` don't trigger workflows.
            - [ ] Complete the Application Flow Checklist below on iOS and Android.
            - [ ] After merging, run `release-03-create-gh-release` with the same versions (voice-sdk: `${{ steps.plan.outputs.voice_version || 'blank' }}`, commons-sdk: `${{ steps.plan.outputs.commons_version || 'blank' }}`).

            ${{ steps.qa.outputs.body }}
          add-paths: |
            package/package.json
            react-voice-commons-sdk/package.json
            react-voice-commons-sdk/lib
          labels: auto-generated
