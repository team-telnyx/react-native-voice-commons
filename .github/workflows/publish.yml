name: Publish to npm

# Trigger on GitHub Releases and from the release workflow.
# Use release tag prefixes to control which package(s) to publish:
#   voice-sdk-v0.4.1   → publishes @telnyx/react-native-voice-sdk only
#   commons-sdk-v0.2.0 → publishes @telnyx/react-voice-commons-sdk only
#   v0.2.0             → publishes both packages (legacy; release-03 now tags each package)
# Each job checks out the release tag, so the published code is exactly what was tagged.
# Prerelease versions are published under their prerelease word, lowercased
# (1.2.0-beta.1 → "beta"), never as "latest". Versions already on npm are skipped, so
# release-03 can be re-run after a partial failure.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag to publish'
        required: true
        type: string

# OIDC: Grant the workflow a short-lived identity token that npm uses to
# verify this publish came from this repo. No stored secrets on any machine.
permissions:
  contents: read
  id-token: write

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Resolve tag name
        id: release
        env:
          TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "::error::Release tag was not provided"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  publish-voice-sdk:
    name: Publish @telnyx/react-native-voice-sdk
    needs: resolve-release
    if: startsWith(needs.resolve-release.outputs.tag_name, 'voice-sdk-v') || (startsWith(needs.resolve-release.outputs.tag_name, 'v') && !contains(needs.resolve-release.outputs.tag_name, '-sdk-'))
    runs-on: ubuntu-latest
    environment: npm-pub
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Verify tag version matches package.json
        working-directory: package
        run: |
          TAG="${{ needs.resolve-release.outputs.tag_name }}"
          # Extract version: voice-sdk-v0.4.1 → 0.4.1, commons-sdk-v0.2.0 → 0.2.0, v0.2.0 → 0.2.0
          TAG_VERSION=$(echo "$TAG" | sed 's/.*-v//' | sed 's/^v//')
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: npm_check
        working-directory: package
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [[ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]]; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm_check.outputs.published != 'true'
        working-directory: package
        run: npm install --legacy-peer-deps

      - name: Publish with provenance
        if: steps.npm_check.outputs.published != 'true'
        working-directory: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # 1.2.0-beta.1 -> "beta", 1.2.0-RC.1 -> "rc"; numeric prereleases (1.2.0-1) -> "next"
            DIST_TAG=$(sed -E 's/^[^-]+-([A-Za-z]+).*$/\1/' <<< "$VERSION" | tr '[:upper:]' '[:lower:]')
            [[ "$DIST_TAG" =~ ^[a-z]+$ ]] || DIST_TAG=next
            npm publish --provenance --access public --tag "$DIST_TAG"
          else
            npm publish --provenance --access public
          fi

  publish-commons-sdk:
    name: Publish @telnyx/react-voice-commons-sdk
    runs-on: ubuntu-latest
    needs: [resolve-release, publish-voice-sdk]
    # Run if: tag targets commons-sdk or both, AND voice-sdk either succeeded or was skipped
    if: |
      always() &&
      (startsWith(needs.resolve-release.outputs.tag_name, 'commons-sdk-v') || (startsWith(needs.resolve-release.outputs.tag_name, 'v') && !contains(needs.resolve-release.outputs.tag_name, '-sdk-'))) &&
      (needs.publish-voice-sdk.result == 'success' || needs.publish-voice-sdk.result == 'skipped')
    environment: npm-pub
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Verify tag version matches package.json
        working-directory: react-voice-commons-sdk
        run: |
          TAG="${{ needs.resolve-release.outputs.tag_name }}"
          TAG_VERSION=$(echo "$TAG" | sed 's/.*-v//' | sed 's/^v//')
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: npm_check
        working-directory: react-voice-commons-sdk
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [[ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]]; then
            echo "::warning::$NAME@$VERSION is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm_check.outputs.published != 'true'
        working-directory: react-voice-commons-sdk
        run: |
          # Switch from local file dependency to published version
          npm run dev:published
          npm install --legacy-peer-deps

      - name: Build
        if: steps.npm_check.outputs.published != 'true'
        working-directory: react-voice-commons-sdk
        run: npm run build

      - name: Publish with provenance
        if: steps.npm_check.outputs.published != 'true'
        working-directory: react-voice-commons-sdk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # 1.2.0-beta.1 -> "beta", 1.2.0-RC.1 -> "rc"; numeric prereleases (1.2.0-1) -> "next"
            DIST_TAG=$(sed -E 's/^[^-]+-([A-Za-z]+).*$/\1/' <<< "$VERSION" | tr '[:upper:]' '[:lower:]')
            [[ "$DIST_TAG" =~ ^[a-z]+$ ]] || DIST_TAG=next
            npm publish --provenance --access public --tag "$DIST_TAG"
          else
            npm publish --provenance --access public
          fi
